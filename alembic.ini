# Alembic configuration for the image matching engine.
# The application also calls Base.metadata.create_all on startup so the demo is
# zero-config; Alembic is provided for formal, reviewable migrations in a real
# deployment. Generate the first migration with:
#   alembic revision --autogenerate -m "initial schema"

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
